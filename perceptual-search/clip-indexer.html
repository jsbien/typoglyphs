<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CLIP Index Generator (Debug Mode)</title>
  <style>
    body { font-family: sans-serif; padding: 1em; }
    code { background: #eee; padding: 2px 4px; border-radius: 4px; }
    input[type="file"] { margin-top: 1em; }
    .log { white-space: pre-wrap; font-family: monospace; background: #f7f7f7; padding: 1em; border: 1px solid #ccc; margin-top: 1em; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.5.1"
      }
    }
  </script>
</head>
<body>
  <h2>CLIP Index Generator (Debug Mode)</h2>
  <p>This version logs detailed messages to console (F12).</p>
  <p>
    <label>
      <input type="checkbox" id="skipNonImages" checked /> Skip non-image files
    </label>
  </p>
  <p id="status">🔄 Loading model...</p>
  <input type="file" id="fileInput" webkitdirectory directory multiple />

  <script type="module">
    import { pipeline } from '@xenova/transformers';

    const status = document.getElementById('status');
    const input = document.getElementById('fileInput');
    const skipNonImages = document.getElementById('skipNonImages');

    console.log('⏳ Loading CLIP model...');
    status.textContent = '⏳ Loading model...';
    const extractor = await pipeline('feature-extraction', 'Xenova/clip-vit-base-patch16');
    console.log('✅ Model loaded.');
    status.textContent = '✅ CLIP model loaded.';

    input.addEventListener('change', async (event) => {
      const files = Array.from(event.target.files);
      const byDir = {};

      for (const file of files) {
        if (skipNonImages.checked && !file.type.startsWith('image/')) {
          console.log(`⏭️ Skipping non-image file: ${file.name}`);
          continue;
        }

        try {
          const img = await loadImage(file);
          const embedding = await extractor(img, { pooling: 'mean', normalize: true });

          const parts = file.webkitRelativePath.split('/');
          const dir = parts.length > 1 ? parts[parts.length - 2] : '';
          if (!byDir[dir]) byDir[dir] = [];

          byDir[dir].push({
            path: file.webkitRelativePath,
            embedding: Array.from(embedding.data)
          });

          console.log(`✅ Processed ${file.name}`);
        } catch (err) {
          console.warn(`❌ Failed to process ${file.name}: ${err.message}`);
        }
      }

      for (const [dir, entries] of Object.entries(byDir)) {
        const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${dir}-clip-index.json`;
        a.textContent = `Download ${dir}-clip-index.json (${entries.length} entries)`;
        document.body.appendChild(document.createElement('br'));
        document.body.appendChild(a);
      }
    });

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
