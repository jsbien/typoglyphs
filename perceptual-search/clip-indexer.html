<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CLIP Indexer (Image Only)</title>
  <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.5.1/dist/transformers.min.js"></script>
</head>
<body>
  <h1>CLIP Image Indexer</h1>
  <input type="file" id="fileInput" multiple />
  <p id="status">Waiting for input...</p>
  <pre id="output"></pre>

  <script type="module">
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    let processor, model;

    async function initModel() {
      status.textContent = '⏳ Loading CLIP model...';
      const model_id = 'Xenova/clip-vit-base-patch16';

      // Load vision processor and model ONLY
      [processor, model] = await Promise.all([
        transformers.AutoProcessor.from_pretrained(model_id, { revision: 'vision' }),
        transformers.CLIPVisionModelWithProjection.from_pretrained(model_id)
      ]);
      status.textContent = '✅ Model loaded. You can now select images.';
    }

    async function encodeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const image = new Image();
            image.onload = async () => {
              const canvas = document.createElement('canvas');
              canvas.width = image.width;
              canvas.height = image.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(image, 0, 0);
              const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

              const imageTensor = await processor(imageData);
              const output = await model(imageTensor);
              const embedding = Array.from(output.image_embeds.data);
              resolve({ name: file.name, embedding });
            };
            image.onerror = () => reject('❌ Failed to load image.');
            image.src = reader.result;
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = () => reject('❌ Failed to read image.');
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('fileInput').addEventListener('change', async (event) => {
      const files = event.target.files;
      if (!model) await initModel();

      status.textContent = `⏳ Processing ${files.length} files...`;

      const results = [];
      for (const file of files) {
        try {
          const result = await encodeImage(file);
          results.push(result);
          status.textContent = `✅ Processed ${file.name}`;
        } catch (err) {
          console.error(`❌ Failed to encode image ${file.name}:`, err);
          status.textContent = `❌ Failed to encode ${file.name}: ${err}`;
        }
      }

      const outputJSON = JSON.stringify(results, null, 2);
      output.textContent = outputJSON;
    });
  </script>
</body>
</html>
