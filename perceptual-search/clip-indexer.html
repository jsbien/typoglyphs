<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CLIP Index Generator (Debug Mode)</title>
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.5.1';

    let extractor;
    let status;

    async function loadModel() {
      status.textContent = '⏳ Loading CLIP model...';
      extractor = await pipeline('feature-extraction', 'Xenova/clip-vit-base-patch16');
      status.textContent = '✅ Model loaded.';
    }

    function isImage(file) {
      return file.type.startsWith('image/');
    }

    function groupByDirectory(files) {
      const groups = {};
      for (const file of files) {
        const path = file.webkitRelativePath || file.name;
        const dir = path.split('/').slice(0, -1).join('/');
        if (!groups[dir]) groups[dir] = [];
        groups[dir].push(file);
      }
      return groups;
    }

    async function encodeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
          const img = new Image();
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const tensor = await extractor._processor.imageToTensor(canvas);
            const output = await extractor(tensor);
            resolve(output.data);
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function generateIndex(event) {
      const files = Array.from(event.target.files).filter(isImage);
      const grouped = groupByDirectory(files);

      for (const [dir, group] of Object.entries(grouped)) {
        const index = [];
        for (const file of group) {
          try {
            const embedding = await encodeImage(file);
            index.push({ file: file.name, embedding });
            console.log(`✅ Processed ${file.name}`);
          } catch (e) {
            console.error(`❌ Failed to encode image ${file.name}:`, e);
          }
        }

        const blob = new Blob([JSON.stringify(index, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = dir.replaceAll('/', '_') + '_clip-index.json';
        a.click();
        URL.revokeObjectURL(url);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      status = document.getElementById('status');
      loadModel();
    });

    window.generateIndex = generateIndex;
  </script>
</head>
<body>
  <h2>CLIP Index Generator (Debug Mode)</h2>
  <p>This version logs detailed messages to console (F12).</p>
  <p id="status">⏳ Initializing...</p>
  <input type="file" webkitdirectory multiple onchange="generateIndex(event)">
</body>
</html>
