<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visual Search — Typoglyphs</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #fdfdfd;
    }
    #results img {
      margin: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #status {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🔍 Visual Search — Typoglyphs</h1>

  <p>Select an image to find similar glyphs:</p>
  <input type="file" id="imageUpload" accept="image/*" />

  <!-- preview of uploaded image -->
  <div id="input-preview" style="margin: 1em 0;"></div>

  <div id="status"></div>
  <div id="results"></div>

  <p><a href="../docs/index.html">← Back to Documentation</a></p>

  <script type="module" src="search.js"></script>
