<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typoglyphs Gallery</title>
  <link id="css-link" rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>Typoglyphs Gallery</h1>

  <!-- ✅ Version number display -->
  <div id="version" class="version"></div>

  <div id="gallery" class="gallery"></div>
  <div id="description" class="description">
    <h2>Description</h2>
    <div id="desc-content">Click on a glyph to see details</div>
  </div>

  <!-- 🔍 Lightbox overlay -->
  <div id="lightbox" class="lightbox">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-caption"></div>
  </div>

  <!-- ✅ Load CSS + JS with cache-busting version -->
  <script>
    const v = "2025-10-02-2"; // keep in sync with APP_VERSION
    document.getElementById("css-link").href = `style.css?v=${v}`;
    const s = document.createElement("script");
    s.src = `script.js?v=${v}`;
    document.body.appendChild(s);
  </script>
</body>
</html>
