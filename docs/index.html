<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typoglyphs Gallery</title>
  <link id="css-link" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>Typoglyphs Gallery</h1>

  <!-- ✅ Version number display -->
  <div id="version" class="version"></div>

  <div id="gallery" class="gallery"></div>
  <div id="description" class="description">
    <h2>Description</h2>
    <div id="desc-content">Click on a glyph to see details</div>
  </div>

  <!-- 🔍 Lightbox overlay -->
  <div id="lightbox" class="lightbox">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-caption"></div>
  </div>

  <!-- ✅ Load CSS + JS with cache-busting timestamp -->
  <script>
    // Generate version string as YYYY-MM-DD-HHMMSS
    const now = new Date();
    const v = now.getFullYear() + "-" +
              String(now.getMonth() + 1).padStart(2, "0") + "-" +
              String(now.getDate()).padStart(2, "0") + "-" +
              String(now.getHours()).padStart(2, "0") +
              String(now.getMinutes()).padStart(2, "0") +
              String(now.getSeconds()).padStart(2, "0");

    // Show version in badge
    document.getElementById("version").innerText = v;

    // Load CSS and JS with version to break cache
    document.getElementById("css-link").href = `style.css?v=${v}`;
    const s = document.createElement("script");
    s.src = `script.js?v=${v}`;
    document.body.appendChild(s);
  </script>
</body>
</html>
