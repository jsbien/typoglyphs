<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typoglyphs Gallery</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link id="css-link" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="sticky-header">
  <h1>Typoglyphs Gallery</h1>
  <div id="version" class="version"></div>
  <div id="filter-bar">
    <input type="text" id="filter-input" list="filter-history" placeholder="Filter glyphs by filename..." />
    <datalist id="filter-history"></datalist>
  </div>
</div>
  
  <div class="layout">
    <!-- Gallery grid -->
    <div id="gallery" class="gallery"></div>

    <!-- Metadata panel -->
    <div id="details" class="details">
      <h2>Details</h2>
      <div id="detail-image"></div>
      <div id="desc-content">Click on a glyph to see details</div>
    </div>
  </div>

  <!-- ✅ Load CSS + JS with cache-busting timestamp -->
  <script>
    const now = new Date();
    const v = now.getFullYear() + "-" +
              String(now.getMonth() + 1).padStart(2, "0") + "-" +
              String(now.getDate()).padStart(2, "0") + "-" +
              String(now.getHours()).padStart(2, "0") +
              String(now.getMinutes()).padStart(2, "0") +
              String(now.getSeconds()).padStart(2, "0");

    document.getElementById("version").innerText = v;
    document.getElementById("css-link").href = `style.css?v=${v}`;
    const s = document.createElement("script");
    s.src = `script.js?v=${v}`;
    document.body.appendChild(s);
  </script>
</body>
</html>
