name: Update typoglyphs index

on:
  push:
    branches:
      - main
    paths:
      - 'descriptions/**'
      - 'keywords/**'

  workflow_dispatch:  # 👈 Manual trigger from GitHub UI

permissions:
  contents: write  # 👈 Enables pushing to repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Run index generator
        run: python3 utils/generate_typoglyphs_index.py .

      - name: 📤 Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add typoglyphs.csv
          git commit -m "chore: auto-update typoglyphs.csv" || echo "No changes to commit"
          git push
