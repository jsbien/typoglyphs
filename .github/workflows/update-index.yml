name: Update Typoglyphs CSV

on:
  push:
    branches:
      - main
    paths:
      - 'descriptions/**'
      - 'keywords/**'

jobs:
  regenerate-csv:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies (if any)
        run: |
          pip install --upgrade pip
          # No dependencies listed, but place here if needed

      - name: ⚙️ Run generate_typoglyphs_index.py
        run: |
          python utils/generate_typoglyphs_index.py . --dry-run || true
          python utils/generate_typoglyphs_index.py .

      - name: 📤 Commit and push if typoglyphs.csv changed
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          if git diff --quiet typoglyphs.csv; then
            echo "✅ No changes to typoglyphs.csv"
          else
            git add typoglyphs.csv
            git commit -m "🔄 Auto-update typoglyphs.csv after changes in descriptions/ or keywords/"
            git push
          fi
