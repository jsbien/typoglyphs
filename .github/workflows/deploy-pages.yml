name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'typoglyphs.csv'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Setup Pages
        uses: actions/configure-pages@v3

      - name: 🏗️ Build site content
        run: |
          mkdir -p site
          cp -r docs/* site/  # Replace with your actual site build logic

      - name: 📤 Upload site
        uses: actions/upload-pages-artifact@v1
        with:
          path: site

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
